name: build-test-publish

on:
  push:
    branches: [master]
    # date versions, e.g. 2026-11-07
    tags: ['[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]']
  pull_request:
  workflow_dispatch:
  schedule:
    # weekly rebuild to pull in Debian security updates and new Chromium (Monday 04:00 UTC)
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and smoke test (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: chromium:test
          # always rebuild from the latest base so apt upgrade picks up security fixes
          pull: true
          no-cache: true

      - name: Check Chromium is installed
        run: docker run --rm --entrypoint chromium chromium:test --version

      - name: Container starts and serves the web GUI
        run: |
          docker run -d --name chromium-test \
            --shm-size=1gb \
            -e PUID=1000 -e PGID=1000 -e TZ=Etc/UTC \
            -p 3001:3001 \
            chromium:test

          for _ in $(seq 1 120); do
            if docker logs chromium-test 2>&1 | grep -q '\[ls.io-init\] done.'; then
              break
            fi
            sleep 1
          done
          docker logs chromium-test 2>&1 | grep -q '\[ls.io-init\] done.'

          for _ in $(seq 1 60); do
            if curl -ksf -o /dev/null https://localhost:3001/; then
              break
            fi
            sleep 1
          done
          curl -ksf -o /dev/null https://localhost:3001/

          for _ in $(seq 1 60); do
            if docker exec chromium-test pgrep -x chromium >/dev/null; then
              break
            fi
            sleep 1
          done
          docker exec chromium-test pgrep -x chromium

      - name: Restart against existing config
        run: |
          docker restart chromium-test
          for _ in $(seq 1 120); do
            if docker logs chromium-test 2>&1 | grep -c '\[ls.io-init\] done.' | grep -q '^2$'; then
              break
            fi
            sleep 1
          done
          docker logs chromium-test 2>&1 | grep -c '\[ls.io-init\] done.' | grep -q '^2$'

          for _ in $(seq 1 60); do
            if curl -ksf -o /dev/null https://localhost:3001/; then
              break
            fi
            sleep 1
          done
          curl -ksf -o /dev/null https://localhost:3001/

      - name: Show container logs on failure
        if: failure()
        run: docker logs chromium-test || true

      - name: Remove test container
        if: always()
        run: docker rm -f chromium-test || true

  publish:
    name: Publish multi-arch image to GHCR
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the date git tag on scheduled builds
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Compute today's date version
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/chromium
          tags: |
            # git tag 2026-11-07 -> image tag 2026-11-07
            type=ref,event=tag
            # monday rebuild -> image tag of the day
            type=raw,value=${{ steps.date.outputs.today }},enable=${{ github.event_name == 'schedule' }}
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # always rebuild from the latest base so apt upgrade picks up security fixes
          pull: true
          no-cache: true

      - name: Create the date git tag for scheduled builds
        if: github.event_name == 'schedule'
        # tags pushed with GITHUB_TOKEN do not re-trigger this workflow
        run: |
          tag="${{ steps.date.outputs.today }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "git tag ${tag} already exists, skipping"
            exit 0
          fi
          git tag "${tag}" "${GITHUB_SHA}"
          git push origin "refs/tags/${tag}"
